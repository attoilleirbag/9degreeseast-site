<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9 Degrees East</title>
<meta name="description" content="9 Degrees East: commercial advisory for low-carbon fuels.">
<meta name="theme-color" content="#061527">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap">
<style>
  /* One idea: arriving at 9° East. A gold meridian draws down the page, a spark draws the orbit and lands as the degree. */
  :root { --ink: #061527; --text: #EEF2F5; --muted: #A8B7C6; --faint: #6F87A3; --line: rgba(160,190,220,0.18); --accent: #D8B66E; --ease: cubic-bezier(.16,1,.3,1); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--ink); color: var(--text); font-family: Manrope, system-ui, sans-serif; overflow: hidden; -webkit-font-smoothing: antialiased; }
  main { height: 100%; display: flex; flex-direction: column; align-items: center; }

  /* The meridian, in two halves that part around the content */
  .mer { flex: 1; width: 1px; position: relative; }
  .mer::before { content: ""; position: absolute; inset: 0; background: linear-gradient(var(--accent), var(--accent)); transform: scaleY(0); }
  .mer.top::before { transform-origin: top; background: linear-gradient(rgba(216,182,110,0), var(--accent) 70%); }
  .mer.bot::before { transform-origin: top; background: linear-gradient(var(--accent), rgba(216,182,110,0)); }
  .play .mer.top::before { animation: grow 1100ms 200ms cubic-bezier(.6,0,.2,1) forwards; }
  .play .mer.bot::before { animation: grow 900ms 1500ms cubic-bezier(.6,0,.2,1) forwards; }
  @keyframes grow { to { transform: scaleY(1); } }

  .core { display: flex; flex-direction: column; align-items: center; padding-block: 34px; }

  .lockup { display: flex; align-items: center; gap: clamp(18px, 2.6vw, 30px); }
  .mark { width: clamp(84px, 11vw, 132px); height: auto; overflow: visible; color: var(--text); }
  .d { fill: none; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; }
  .ring { fill: none; stroke: var(--accent); transform-origin: 71px 25px; transform-box: view-box; opacity: 0; }
  .ping, .ping2 { fill: none; stroke: var(--accent); transform-origin: 71px 25px; transform-box: view-box; opacity: 0; }
  .comet { fill: #FFE9B8; opacity: 0; filter: drop-shadow(0 0 3px #F0CF85); }
  .play .bowl { animation: dash 900ms 2000ms cubic-bezier(.6,0,.2,1) forwards; }
  .play .stem { animation: dash 460ms 2800ms cubic-bezier(.6,0,.2,1) forwards; }
  .play .ring { animation: pop 620ms 3380ms cubic-bezier(.2,1.8,.4,1) forwards; }
  .play .ping { animation: ping 1600ms 3420ms ease-out forwards; }
  .play .ping2 { animation: ping 1900ms 3640ms ease-out forwards; }
  @keyframes dash { to { stroke-dashoffset: 0; } }
  @keyframes pop { from { opacity: 0; transform: scale(0.2); } to { opacity: 1; transform: scale(1); } }
  @keyframes ping { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(5); } }

  .word { display: flex; flex-direction: column; gap: clamp(8px, 1vw, 12px); font-weight: 600; font-size: clamp(15px, 2vw, 24px); letter-spacing: 0.32em; line-height: 1; }
  .word .row { display: flex; align-items: center; gap: clamp(10px, 1.2vw, 14px); }
  .word .rule { height: 2px; width: clamp(20px, 2.6vw, 34px); background: var(--accent); transform: scaleX(0); transform-origin: left; }
  .word span.w { opacity: 0; transform: translateX(-10px); display: inline-block; }
  .play .word span.w { animation: slide 900ms var(--ease) forwards; }
  .play .word span.r1 { animation-delay: 3300ms; }
  .play .word span.r2 { animation-delay: 3550ms; }
  .play .word .rule { animation: rule 700ms 3450ms var(--ease) forwards; }
  @keyframes slide { to { opacity: 1; transform: none; } }
  @keyframes rule { to { transform: scaleX(1); } }

  .tag { margin: 30px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(18px, 1.9vw, 23px); color: var(--muted); text-align: center; opacity: 0; }
  .tag em { color: var(--text); font-style: italic; }
  .play .tag { animation: show 1000ms 4000ms ease forwards; }

  .enter { margin-top: 30px; display: inline-flex; align-items: center; gap: 14px; min-height: 48px; padding: 0 8px; color: var(--text); text-decoration: none; font-size: 11px; font-weight: 600; letter-spacing: 0.42em; text-transform: uppercase; opacity: 0; transform: translateY(8px); }
  .enter .ln { width: 26px; height: 1px; background: var(--accent); transition: width 500ms var(--ease); }
  .enter .ar { color: var(--accent); transition: transform 500ms var(--ease); }
  .enter:hover .ln, .enter:focus-visible .ln { width: 54px; }
  .enter:hover .ar, .enter:focus-visible .ar { transform: translateX(6px); }
  .enter:focus-visible { outline: 2px solid var(--accent); outline-offset: 6px; }
  .play .enter { animation: rise 900ms 4400ms var(--ease) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @keyframes show { to { opacity: 1; } }

  /* Second visit in the same session, or no motion: show the finished frame at once */
  .still .mer::before, .still .word .rule { transform: none; }
  .still .d { stroke-dashoffset: 0; }
  .still .ring, .still .tag, .still .word span.w { opacity: 1; transform: none; }
  .still .enter { opacity: 1; transform: none; }

  /* Leaving: the meridian widens into the next page */
  .wipe { position: fixed; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--ink); transform: translateX(-50%); pointer-events: none; z-index: 5; opacity: 0; }
  .leaving .wipe { opacity: 1; }
  .wipe::after { content: ""; position: absolute; inset: 0; background: var(--accent); opacity: 0.9; }
  .leaving .wipe { animation: widen 650ms cubic-bezier(.7,0,.2,1) forwards; }
  .leaving .wipe::after { animation: dim 650ms ease forwards; }
  @keyframes widen { to { width: 100vw; } }
  @keyframes dim { to { opacity: 0; } }
  .leaving .core { transition: opacity 300ms ease; opacity: 0; }

  .corner { position: fixed; bottom: 22px; left: 0; right: 0; display: flex; justify-content: space-between; padding-inline: max(22px, env(safe-area-inset-left, 0px)) max(22px, env(safe-area-inset-right, 0px)); font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--faint); opacity: 0; }
  .play .corner { animation: show 1200ms 4400ms ease forwards; }
  .still .corner { opacity: 1; }

  @media (max-width: 560px) {
    .lockup { flex-direction: column; gap: 22px; }
    .word { align-items: center; }
    .core { padding-block: 26px; }
    .corner { display: none; }
  }
</style>
</head>
<body>
<main>
  <h1 style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">9 Degrees East</h1>
  <div class="mer top" aria-hidden="true"></div>
  <div class="core">
    <div class="lockup">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <path class="d orbit" pathLength="1" d="M28 88.11 A44 44 0 1 1 92.3 62.13" stroke="currentColor" stroke-width="2.6"/>
        <path class="d bowl" pathLength="1" d="M46 27 A16 16 0 1 1 46 59 A16 16 0 1 1 46 27" stroke="currentColor" stroke-width="8"/>
        <path class="d stem" pathLength="1" d="M60.5 49.8 L46.8 79" stroke="currentColor" stroke-width="8"/>
        <circle class="ping" cx="71" cy="25" r="5" stroke-width="1"/>
        <circle class="ping2" cx="71" cy="25" r="5" stroke-width="0.8"/>
        <circle class="ring" cx="71" cy="25" r="5" stroke-width="3.4"/>
        <path id="cometPath" d="M28 88.11 A44 44 0 1 1 92.3 62.13 Q96 30 71 25" fill="none" stroke="none"/>
        <circle class="comet" id="comet" r="2.6" cx="28" cy="88.11"/>
      </svg>
      <div class="word" aria-hidden="true">
        <div class="row"><span class="w r1">DEGREES</span></div>
        <div class="row"><span class="rule"></span><span class="w r2">EAST</span></div>
      </div>
    </div>
    <p class="tag">Commercial advisory for <em>low-carbon fuels</em></p>
    <a class="enter" id="enter" href="home.html"><span class="ln" aria-hidden="true"></span>Enter<span class="ar" aria-hidden="true">→</span></a>
  </div>
  <div class="mer bot" aria-hidden="true"></div>
  <div class="corner" aria-hidden="true"><span>London</span><span>Est. 2018</span></div>
  <div class="wipe" aria-hidden="true"></div>
</main>
<script>
(function () {
  // Before launch, set this to true so visitors who ask for less motion get the finished frame.
  var RESPECT_REDUCED_MOTION = false;
  var body = document.body;
  var seen = false; try { seen = sessionStorage.getItem('9de-intro') === '1'; sessionStorage.setItem('9de-intro', '1'); } catch (e) {}
  var reduced = RESPECT_REDUCED_MOTION && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (seen || reduced) { body.classList.add('still'); }
  else {
    body.classList.add('play');
    // The spark travels the orbit, drawing it behind it, then curves in and lands as the degree ring
    var orbit = document.querySelector('.orbit'), path = document.getElementById('cometPath'), c = document.getElementById('comet');
    var total = path.getTotalLength(), arc = 2 * Math.PI * 44 * (256 / 360), DUR = 2100, START = 1300;
    function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    setTimeout(function () {
      var t0 = performance.now(); c.style.transition = 'opacity 300ms'; c.style.opacity = 1;
      requestAnimationFrame(function frame(now) {
        var t = Math.min(1, (now - t0) / DUR), d = ease(t) * total, pt = path.getPointAtLength(d);
        c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y);
        orbit.style.strokeDashoffset = String(1 - Math.min(1, d / arc));
        if (t < 1) requestAnimationFrame(frame); else c.style.opacity = 0;
      });
    }, START);
  }
  // Enter: widen the meridian, then go
  var enter = document.getElementById('enter');
  enter.addEventListener('click', function (ev) {
    if (reduced || ev.metaKey || ev.ctrlKey || ev.shiftKey) return;
    ev.preventDefault(); body.classList.add('leaving');
    setTimeout(function () { location.href = enter.href; }, 620);
  });
  // Coming back with the browser's Back button shows the finished frame, not a covered page
  addEventListener('pageshow', function (e) { if (e.persisted) { body.classList.remove('leaving', 'play'); body.classList.add('still'); document.querySelector('.orbit').style.strokeDashoffset = '0'; } });
})();
</script>
</body>
</html>
