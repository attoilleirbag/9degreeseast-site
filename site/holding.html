<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>9 Degrees East | Low-carbon fuels advisory</title>
<meta name="description" content="9 Degrees East: commercial advisory for low-carbon fuels.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#061527">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600&display=swap">
<style>
  /* Holding page: the opening animation, which plays once and then rests on the logo. */
  :root { --ink: #061527; --text: #EEF2F5; --muted: #A8B7C6; --faint: #6F87A3; --accent: #D8B66E; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--text); font-family: Manrope, system-ui, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  /* Opening (once per visit): the gold meridian draws down the page, a spark traces the orbit and lands as the degree,
     the wordmark and tagline appear, then the meridian widens and hands over to the home page. Click or any key skips. */
  .intro { display: none; }
  .intro { display: flex; flex-direction: column; align-items: center; position: fixed; inset: 0; z-index: 200; background: var(--ink); }
  .intro-on body { overflow: hidden; }
  .intro .mer { flex: 1; width: 1px; position: relative; }
  .intro .mer::before { content: ""; position: absolute; inset: 0; transform: scaleY(0); transform-origin: top; }
  .intro .mer.top::before { background: linear-gradient(rgba(216,182,110,0), var(--accent) 70%); animation: i-grow 1100ms 200ms cubic-bezier(.6,0,.2,1) forwards; }
  .intro .mer.bot::before { background: linear-gradient(var(--accent), rgba(216,182,110,0)); animation: i-grow 900ms 1500ms cubic-bezier(.6,0,.2,1) forwards; }
  .intro .core { display: flex; flex-direction: column; align-items: center; padding-block: 34px; }
  .intro .lockup { display: flex; align-items: center; gap: clamp(18px, 2.6vw, 30px); }
  .intro .mark { width: clamp(84px, 11vw, 132px); height: auto; overflow: visible; color: var(--text); }
  .intro .d { fill: none; stroke-linecap: round; stroke-dasharray: 1; stroke-dashoffset: 1; opacity: 0; }
  .intro .bowl { animation: i-dash 900ms 2000ms cubic-bezier(.6,0,.2,1) forwards; }
  .intro .stem { animation: i-dash 460ms 2800ms cubic-bezier(.6,0,.2,1) forwards; }
  .intro .ring, .intro .ping, .intro .ping2 { fill: none; stroke: var(--accent); transform-origin: 71px 25px; transform-box: view-box; opacity: 0; }
  .intro .ring { animation: i-pop 620ms 3380ms cubic-bezier(.2,1.8,.4,1) forwards; }
  .intro .ping { animation: i-ping 1600ms 3420ms ease-out forwards; }
  .intro .ping2 { animation: i-ping 1900ms 3640ms ease-out forwards; }
  .intro .comet { fill: #FFE9B8; opacity: 0; filter: drop-shadow(0 0 3px #F0CF85); }
  .intro .word { display: flex; flex-direction: column; gap: clamp(8px, 1vw, 12px); font-weight: 600; font-size: clamp(15px, 2vw, 24px); letter-spacing: 0.32em; line-height: 1; }
  .intro .word .row { display: flex; align-items: center; gap: clamp(10px, 1.2vw, 14px); }
  .intro .word .rule { height: 2px; width: clamp(20px, 2.6vw, 34px); background: var(--accent); transform: scaleX(0); transform-origin: left; animation: i-rule 700ms 3450ms cubic-bezier(.16,1,.3,1) forwards; }
  .intro .word span.w { display: inline-block; opacity: 0; transform: translateX(-10px); animation: i-slide 900ms cubic-bezier(.16,1,.3,1) forwards; }
  .intro .word span.r1 { animation-delay: 3300ms; } .intro .word span.r2 { animation-delay: 3550ms; }
  .intro .itag { margin: 30px 0 0; font-family: 'Instrument Serif', Georgia, serif; font-size: clamp(18px, 1.9vw, 23px); color: var(--muted); text-align: center; opacity: 0; animation: i-show 1000ms 4000ms ease forwards; }
  .intro .itag em { color: var(--text); font-style: italic; }
  .intro .corner { position: fixed; bottom: 22px; right: 22px; font-size: 9.5px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--faint); opacity: 0; animation: i-show 1200ms 4400ms ease forwards; }
  /* The hand-over: the meridian widens across the screen, then the opening lifts away */
  .intro .wipe { position: fixed; top: 0; bottom: 0; left: 50%; width: 1px; background: var(--ink); transform: translateX(-50%); pointer-events: none; opacity: 0; }
  .intro .wipe::after { content: ""; position: absolute; inset: 0; background: var(--accent); opacity: 0.9; }
  .intro.leaving .wipe { opacity: 1; animation: i-widen 650ms cubic-bezier(.7,0,.2,1) forwards; }
  .intro.leaving .wipe::after { animation: i-dim 650ms ease forwards; }
  .intro.leaving .core, .intro.leaving .corner, .intro.leaving .mer { transition: opacity 300ms ease; opacity: 0; }
  .intro.gone { animation: i-out 450ms ease forwards; }
  @keyframes i-grow { to { transform: scaleY(1); } }
  @keyframes i-dash { from { opacity: 1; } to { stroke-dashoffset: 0; opacity: 1; } }
  @keyframes i-pop { from { opacity: 0; transform: scale(0.2); } to { opacity: 1; transform: scale(1); } }
  @keyframes i-ping { 0% { opacity: 0.9; transform: scale(1); } 100% { opacity: 0; transform: scale(5); } }
  @keyframes i-slide { to { opacity: 1; transform: none; } }
  @keyframes i-rule { to { transform: scaleX(1); } }
  @keyframes i-show { to { opacity: 1; } }
  @keyframes i-widen { to { width: 100vw; } }
  @keyframes i-dim { to { opacity: 0; } }
  @keyframes i-out { to { opacity: 0; visibility: hidden; } }
  /* The home page waits under the opening, then rises in as it lifts */
  .intro-on .hero-copy > *, .intro-on .hero-art, .intro-on .wx { animation-play-state: paused; }
  @media (max-width: 560px) { .intro .lockup { flex-direction: column; gap: 22px; } .intro .word { align-items: center; } .intro .core { padding-block: 26px; } .intro .corner { display: none; } }
  @media (prefers-reduced-motion: reduce) { .intro *, .intro *::before { animation-duration: 1ms !important; animation-delay: 0ms !important; } }
  .gate { position: fixed; left: 50%; bottom: 40px; transform: translateX(-50%); display: none; gap: 8px; z-index: 300; }
  .gate.on { display: flex; }
  .gate input { width: 190px; padding: 10px 12px; background: rgba(9,28,50,0.9); border: 1px solid rgba(160,190,220,0.25); border-radius: 2px; color: var(--text); font: 500 14px Manrope, sans-serif; outline: none; }
  .gate input:focus { border-color: var(--accent); }
  .gate button { padding: 10px 14px; background: var(--accent); color: var(--ink); border: 0; border-radius: 2px; font: 600 13px Manrope, sans-serif; cursor: pointer; }
  .gate.no input { border-color: #E39A55; }
  .intro .mark { cursor: default; }
</style>
</head>
<body>
  <div class="intro" id="intro" role="img" aria-label="9 Degrees East. Commercial advisory for low-carbon fuels.">
    <div class="mer top"></div>
    <div class="core">
      <div class="lockup">
        <svg class="mark" viewBox="0 0 100 100">
          <path class="d orbit" pathLength="1" d="M28 88.11 A44 44 0 1 1 92.3 62.13" stroke="currentColor" stroke-width="2.6"/>
          <path class="d bowl" pathLength="1" d="M46 27 A16 16 0 1 1 46 59 A16 16 0 1 1 46 27" stroke="currentColor" stroke-width="8"/>
          <path class="d stem" pathLength="1" d="M60.5 49.8 L46.8 79" stroke="currentColor" stroke-width="8"/>
          <circle class="ping" cx="71" cy="25" r="5" stroke-width="1"/>
          <circle class="ping2" cx="71" cy="25" r="5" stroke-width="0.8"/>
          <circle class="ring" cx="71" cy="25" r="5" stroke-width="3.4"/>
          <path id="cometPath" d="M28 88.11 A44 44 0 1 1 92.3 62.13 Q96 30 71 25" fill="none" stroke="none"/>
          <circle class="comet" id="comet" r="2.6" cx="28" cy="88.11"/>
        </svg>
        <div class="word">
          <div class="row"><span class="w r1">DEGREES</span></div>
          <div class="row"><span class="rule"></span><span class="w r2">EAST</span></div>
        </div>
      </div>
      <p class="itag">Commercial advisory for <em>low-carbon fuels</em></p>
    </div>
    <div class="mer bot"></div>
    <div class="corner">Est. 2018</div>
  </div>
<script>
  // The spark travels the orbit and lands as the degree. No hand-over: the page rests here.
  (function () {
    var el = document.getElementById('intro');
    var orbit = el.querySelector('.orbit'), path = document.getElementById('cometPath'), c = document.getElementById('comet');
    var total = path.getTotalLength(), arc = 2 * Math.PI * 44 * (256 / 360), DUR = 2100;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { orbit.style.opacity = 1; orbit.style.strokeDashoffset = 0; return; }
    function ease(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    setTimeout(function () {
      var t0 = performance.now(); c.style.transition = 'opacity 300ms'; c.style.opacity = 1; orbit.style.opacity = 1;
      requestAnimationFrame(function frame(now) {
        var t = Math.min(1, (now - t0) / DUR), d = ease(t) * total, pt = path.getPointAtLength(d);
        c.setAttribute('cx', pt.x); c.setAttribute('cy', pt.y);
        orbit.style.strokeDashoffset = String(1 - Math.min(1, d / arc));
        if (t < 1) requestAnimationFrame(frame); else c.style.opacity = 0;
      });
    }, 1300);
  })();
</script>
<form class="gate" id="gate" autocomplete="off"><input id="pw" type="password" aria-label="Preview password" placeholder="Preview password"><button>Enter</button></form>
<script>
  // Private preview: tap the logo three times, enter the password, and the full site opens in this browser for 30 days.
  // The password is never stored on this page; Netlify checks it.
  (function () {
    var taps = 0, tt, gate = document.getElementById('gate'), pw = document.getElementById('pw');
    document.querySelector('.intro .mark').addEventListener('click', function () {
      taps++; clearTimeout(tt); tt = setTimeout(function () { taps = 0; }, 900);
      if (taps >= 3) { gate.classList.add('on'); pw.focus(); }
    });
    gate.addEventListener('submit', function (e) {
      e.preventDefault(); var v = pw.value.trim().replace(/[^A-Za-z0-9_-]/g, '');
      if (!v) return;
      document.cookie = v + '=1; path=/; max-age=2592000; secure; samesite=lax';
      fetch('/?check=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.text(); }).then(function (t) {
        if (t.indexOf('id="gate"') === -1) { location.href = '/'; }
        else { document.cookie = v + '=; path=/; max-age=0'; gate.classList.add('no'); pw.value = ''; setTimeout(function () { gate.classList.remove('no'); }, 1200); }
      });
    });
  })();
</script>
</body>
</html>
