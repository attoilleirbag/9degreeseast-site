# 9DE Journal editor (Decap CMS). Tom logs in with GitHub; each Publish saves to the website project
# and Netlify rebuilds the site. Articles live in content/journal, images in site/media/journal.
backend:
  name: github
  repo: attoilleirbag/9degreeseast-site
  branch: main
  commit_messages:
    create: "Journal: new article “{{slug}}”"
    update: "Journal: update “{{slug}}”"
    delete: "Journal: delete “{{slug}}”"
    uploadMedia: "Journal: add image {{path}}"
    deleteMedia: "Journal: remove image {{path}}"

# Drafts: "Save" keeps an article private; it only goes on the website when he clicks Publish
publish_mode: editorial_workflow

site_url: https://9degreeseast.com
display_url: https://9degreeseast.com/journal
logo_url: /admin/logo.svg
locale: en

media_folder: site/media/journal
public_folder: /media/journal

collections:
  - name: journal
    label: 9DE Journal
    label_singular: Article
    description: Articles for the 9DE Journal. Click Publish and the article appears on the website about a minute later.
    folder: content/journal
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    format: json-frontmatter
    frontmatter_delimiter: "~~~"
    sortable_fields: [date, title]
    summary: "{{title}} ({{date | date('D MMM YYYY')}})"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Summary, name: summary, widget: text, required: false, hint: "One or two sentences. Shown under the title and on the Journal page." }
      - { label: Date, name: date, widget: datetime, date_format: "D MMM YYYY", time_format: false, format: "YYYY-MM-DD" }
      - { label: Author, name: author, widget: string, default: Tom Fox }
      - label: Series
        name: series
        widget: string
        required: false
        hint: "Type the series name, e.g. Fuels. Use exactly the same name on every part so they link together. Leave empty for a stand-alone article."
      - { label: Part, name: part, widget: number, required: false, value_type: int, min: 1, hint: "For a series: which part this is (1, 2, 3…)." }
      - { label: Parts in the series, name: parts, widget: number, required: false, value_type: int, min: 1, hint: "For a series: how many parts in total, e.g. 4." }
      - { label: Cover image, name: cover, widget: image, required: false }
      - { label: Cover image description, name: cover_alt, widget: string, required: false, hint: "A few words describing the image, for screen readers." }
      - { label: Article, name: body, widget: markdown, buttons: [bold, italic, link, heading-two, heading-three, quote, bulleted-list, numbered-list], editor_components: [image, textsize], hint: "To add a footnote, type [1], [2] and so on where it applies, then write the note under Notes below. For a different text size, use the + button and choose Text size." }
      - label: Notes
        name: notes
        widget: list
        required: false
        summary: "{{fields.note}}"
        hint: "Footnotes, shown in a numbered list at the end. Note 1 matches [1] in the text, note 2 matches [2], and so on."
        field: { label: Note, name: note, widget: text }
