<style>
  /* Page shell: shared menu, title and intro, and placeholder slots for the sections the page will hold. */
  :root { --c: #5EC8D8; }
  /* Journal feed: one list, filtered by source. Substack items are added automatically each week by scripts/update-journal.mjs. */
  .feed { padding-bottom: 64px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .chip { display: inline-flex; align-items: center; gap: 8px; padding: 8px 14px; font: 600 13px Manrope, sans-serif; color: var(--soft); background: rgba(9,28,50,0.6); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; transition: border-color .2s, color .2s; }
  .chip img { width: 14px; height: 14px; object-fit: contain; }
  .card .src.ic::before { display: none; } .card .src img { width: 14px; height: 14px; object-fit: contain; }
  .chip i { width: 7px; height: 7px; border-radius: 50%; background: var(--sc); box-shadow: 0 0 6px var(--sc); }
  .chip small { font-weight: 500; color: var(--faint); }
  .chip[aria-pressed="true"] { border-color: var(--sc); color: var(--text); }
  .cards { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .card { display: flex; flex-direction: column; gap: 10px; padding: 22px 24px; color: inherit; text-decoration: none; transition: border-color .25s, transform .25s; }
  a.card:hover { border-color: var(--sc); transform: translateY(-2px); }
  .card .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: 12px; color: var(--faint); }
  .card .src { display: inline-flex; align-items: center; gap: 7px; font-size: 11.5px; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--sc); }
  .card .src::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--sc); box-shadow: 0 0 6px var(--sc); }
  .card h2 { margin: 0; font-size: 27px; line-height: 1.12; }
  .card p { margin: 0; font-size: 15px; line-height: 1.7; color: var(--soft); }
  .card .go { margin-top: auto; padding-top: 6px; font-size: 13px; font-weight: 600; color: var(--accent); }
  .card.waiting { border-style: dashed; }
  .card.waiting p { color: var(--faint); }
  .credit { margin: 18px 0 0; font-size: 13px; color: var(--faint); }
  .credit a { color: var(--accent); }
  @media (max-width: 700px) { .cards { grid-template-columns: 1fr; } }
</style>

<script>
/* ===== DATA ===== The Journal's list. Substack posts are added automatically each week (scripts/update-journal.mjs);
   LinkedIn and press items are added by hand. source: journal | substack | linkedin | press. date: YYYY-MM-DD or YYYY-MM or YYYY. */
var JOURNAL = /*DATA:START*/{
  "updated": "2026-11-02",
  "substack": { "url": "https://tomfoxlondon.substack.com", "name": "" },
  "items": [
    { "source": "linkedin", "date": "2026-11-02", "title": "Liquid Fuels in the Transition, Part 1: Replacing Something (Thermodynamically) Beautiful", "summary": "Fossil fuels are the product of a hundred million years of free manufacturing by plankton, plants and deep time. Replacing them means rebuilding that supply chain from scratch, and this essay looks at what that really takes.", "url": "https://www.linkedin.com/pulse/liquid-fuels-transition-part-1-replacing-something-beautiful-tom-fox-ountf" },
    { "source": "press", "outlet": "Biofuels International", "date": "2020-04", "title": "From RED to RED II", "summary": "The next stage of European biofuels legislation, and why moving from RED to RED II is full of complicated, fascinating opportunities.", "url": "" },
    { "source": "press", "outlet": "Biofuels International", "date": "2020", "title": "The COVID-19 price effect", "summary": "How the pandemic moved biofuel and fossil fuel prices differently, and how it accelerated structural trends already under way.", "url": "" },
    { "source": "press", "outlet": "Biofuels International", "date": "2021", "title": "Renewable diesel for the US market", "summary": "The buzz around HVO and renewable diesel: a lot of traditional capacity in the queue, and some new approaches worth considering.", "url": "" },
    { "source": "press", "outlet": "ACI Oleofuels Online Series", "date": "2022-04", "title": "Talk: renewable diesel feedstocks", "summary": "Hosted a table on renewable diesel, the feedstock supply challenge, and the emerging technologies that could bring more renewable diesel and SAF online.", "url": "" }
  ]
}/*DATA:END*/;

(function () {
  var SOURCES = { all: ['All', '#D8B66E'], journal: ['The 9DE Journal', '#D8B66E'], substack: ['Substack', '#FF8A4C'], linkedin: ['LinkedIn', '#5EC8D8'], press: ['Press and talks', '#A9A2F0'] };
  var MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function when(d) { var p = String(d).split('-'); return p.length >= 2 ? (p[2] ? (+p[2]) + ' ' : '') + MONTHS[+p[1] - 1] + ' ' + p[0] : esc(d); }
  // Articles Tom publishes from the editor (/admin) arrive in journal-posts.json, built on each deploy
  var extra = []; try { var xr = new XMLHttpRequest(); xr.open('GET', 'journal-posts.json', false); xr.send(); if (xr.status === 200) extra = JSON.parse(xr.responseText).items || []; } catch (e) {}
  JOURNAL.items = extra.concat(JOURNAL.items);
  var items = JOURNAL.items.slice().sort(function (a, b) { return String(b.date).localeCompare(String(a.date)); });
  var counts = {}; items.forEach(function (i) { counts[i.source] = (counts[i.source] || 0) + 1; });
  var ICON = { substack: 'logos/substack.png', linkedin: 'logos/linkedin.svg' };
  var order = ['all', 'journal', 'substack', 'linkedin', 'press'];
  var chips = document.getElementById('chips'), cards = document.getElementById('cards'), active = 'all';
  chips.innerHTML = order.filter(function (k) { return k === 'all' || counts[k] || k === 'substack' || k === 'linkedin'; }).map(function (k) {
    var n = k === 'all' ? items.length : (counts[k] || 0);
    return '<button class="chip" type="button" data-s="' + k + '" style="--sc:' + SOURCES[k][1] + '" aria-pressed="' + (k === active) + '">' + (ICON[k] ? '<img src="' + ICON[k] + '" alt="" width="14" height="14">' : '<i></i>') + SOURCES[k][0] + ' <small>' + n + '</small></button>';
  }).join('');
  function waiting(k) {
    var text = k === 'substack'
      ? (JOURNAL.substack.url ? 'New posts from <b>' + esc(JOURNAL.substack.name || 'our Substack') + '</b> will appear here automatically each week.' : 'Posts from the 9 Degrees East Substack will appear here automatically each week, once the newsletter is live.')
      : 'Selected LinkedIn posts by Tom Fox will appear here. <a href="https://www.linkedin.com/in/tom-fox-energy/" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">See them on LinkedIn →</a>';
    return '<div class="card glass waiting" style="--sc:' + SOURCES[k][1] + '"><span class="src ic"><img src="' + ICON[k] + '" alt="" width="14" height="14">' + SOURCES[k][0] + '</span><p>' + text + '</p></div>';
  }
  function render() {
    var RANK = { journal: 0, substack: 1, linkedin: 2, press: 3 };
    var list = items.filter(function (i) { return active === 'all' || i.source === active; }).slice().sort(function (a, b) { return (RANK[a.source] - RANK[b.source]) || String(b.date).localeCompare(String(a.date)); });
    var card = function (i) {
      var s = SOURCES[i.source] || SOURCES.journal, tag = i.url ? 'a' : 'article';
      var href = i.url ? ' href="' + esc(i.url) + '"' + (/^https?:/.test(i.url) ? ' target="_blank" rel="noopener noreferrer"' : '') : '';
      var outlet = i.outlet ? ' · ' + esc(i.outlet) : '';
      return '<' + tag + ' class="card glass" style="--sc:' + s[1] + '"' + href + '><div class="meta">' + (ICON[i.source] ? '<span class="src ic"><img src="' + ICON[i.source] + '" alt="" width="14" height="14">' : '<span class="src">') + (i.series ? esc(i.series) + (i.part ? ' · Part ' + esc(i.part) : '') : s[0]) + '</span><span>' + when(i.date) + outlet + (i.reposted ? ' · Reposted' : '') + (i.minutes ? ' · ' + esc(i.minutes) + ' min read' : '') + (i.audio ? ' · Audio' : '') + '</span></div>' +
        '<h2 class="serif">' + esc(i.title) + '</h2>' + (i.summary ? '<p>' + esc(i.summary) + '</p>' : '') + (i.url ? '<span class="go">' + (i.source === 'journal' ? 'Read the article' : 'Read on ' + (i.source === 'press' ? esc(i.outlet || 'the publisher') : s[0])) + ' →</span>' : '') + '</' + tag + '>';
    };
    var own = list.filter(function (i) { return i.source === 'journal'; }).map(card).join('');
    var html = list.filter(function (i) { return i.source !== 'journal'; }).map(card).join('');
    // Substack and LinkedIn first, then press and talks
    var lead = '';
    if (active === 'substack' && !counts.substack) lead += waiting('substack');
    if (active === 'linkedin' && !counts.linkedin) lead += waiting('linkedin');
    html = own + lead + html;
    cards.innerHTML = html;
  }
  chips.addEventListener('click', function (e) { var b = e.target.closest('.chip'); if (!b) return; active = b.dataset.s; chips.querySelectorAll('.chip').forEach(function (c) { c.setAttribute('aria-pressed', String(c === b)); }); render(); });
  render();
})();
</script>
