# Netlify settings for 9degreeseast.com
[build]
  publish = "site"
  # Builds the Journal articles Tom writes in the editor (content/journal -> site/journal-*.html)
  command = "node scripts/build-journal.mjs"
  # Skip the deploy when a commit doesn't change anything in site/ (saves build credits)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- site/ netlify.toml content/ scripts/build-journal.mjs"

# The old home page address now goes to the front page
[[redirects]]
  from = "/home.html"
  to = "/"
  status = 301
  force = true

# ---- HOLDING PAGE (temporary) ----
# While the site is being fixed, every address shows the holding page.
# The full site is untouched. To bring it back, delete everything from
# the HOLDING PAGE line down to END HOLDING PAGE, and commit.
[[redirects]]
  from = "/favicon.svg"
  to = "/favicon.svg"
  status = 200
  force = true

[[redirects]]
  from = "/favicon.ico"
  to = "/favicon.ico"
  status = 200
  force = true

[[redirects]]
  from = "/apple-touch-icon.png"
  to = "/apple-touch-icon.png"
  status = 200
  force = true

# The Journal editor works while the site is hidden
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/journal-article.css"
  to = "/journal-article.css"
  status = 200
  force = true

[[redirects]]
  from = "/icon-512.png"
  to = "/icon-512.png"
  status = 200
  force = true

# Anyone with the preview cookie (set by entering the password on the
# holding page) sees the full site instead.
[[redirects]]
  from = "/*"
  to = "/:splat"
  status = 200
  force = true
  conditions = {Cookie = ["testedit"]}

[[redirects]]
  from = "/*"
  to = "/holding.html"
  status = 200
  force = true
# ---- END HOLDING PAGE ----
