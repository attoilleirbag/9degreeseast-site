name: Update Journal

on:
  schedule:
    - cron: '45 6 * * 1'   # every Monday at 06:45 UTC, after Fuel Weather and the Policy Tracker
  workflow_dispatch:        # adds a "Run workflow" button for testing

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Look for new Substack posts
        run: node scripts/update-journal.mjs
      - name: Publish new posts
        run: |
          git config user.name "journal-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/journal.html
          if git diff --cached --quiet; then
            echo "Nothing new this week."
          else
            git commit -m "Journal: new Substack posts"
            git push
          fi
