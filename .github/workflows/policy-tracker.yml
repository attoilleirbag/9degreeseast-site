name: Update Policy Tracker

on:
  schedule:
    - cron: '30 6 * * 1'   # every Monday at 06:30 UTC, after Fuel Weather
  workflow_dispatch:        # adds a "Run workflow" button for testing

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Look for new policy items
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: node scripts/update-policy.mjs
      - name: Publish new items
        run: |
          cat policy-found.md
          git config user.name "policy-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add site/policy-tracker.html scripts/policy-state.json
          if git diff --cached --quiet; then
            echo "Nothing new this week."
          else
            git commit -m "Policy Tracker: weekly update"
            git push
          fi
